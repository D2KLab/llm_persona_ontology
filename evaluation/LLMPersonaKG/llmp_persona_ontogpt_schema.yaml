id: https://w3id.org/llm-persona/ontogpt-schema
name: llmp-persona-ontogpt-schema-fixed-internal-snake
title: LLMP Persona OntoGPT Schema, fixed with internal snake_case fields
description: OntoGPT-compatible extraction schema. Internal field names are snake_case so OntoGPT/Pydantic preserves them;
  slot_uri keeps the original ontology terminology for RDF mapping.
license: https://creativecommons.org/licenses/by/4.0/
prefixes:
  linkml: https://w3id.org/linkml/
  llmp: https://w3id.org/llm-persona/
  llmpv: https://w3id.org/llm-persona/vocab/
  schema: https://schema.org/
  schema_http: http://schema.org/
  skos: http://www.w3.org/2004/02/skos/core#
  dcterms: http://purl.org/dc/terms/
  bio: http://purl.org/vocab/bio/0.1/
  foaf: http://xmlns.com/foaf/0.1/
  rel: http://purl.org/vocab/relationship/
  prov: http://www.w3.org/ns/prov#
  xsd: http://www.w3.org/2001/XMLSchema#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
default_prefix: llmp
default_range: string
imports:
- linkml:types
classes:
  LLMPersona:
    description: 'A structured persona intended to guide, describe, evaluate, or configure an LLM agent or role. This OntoGPT
      extraction schema is intentionally flat: values should be strings, numbers, dates, or controlled enum values, never
      nested dictionaries.


      Extraction formatting rules: return YAML only. For every field, return either an empty list [] or a list of plain strings.
      Never return null, None, [None], the string "[]", bracketed strings such as "[34]", nested dictionaries, or objects.
      If a value is absent, use [] only.


      Ontology terminology rule: property names in this schema match the local names of the ontology properties from slot_uri.
      For example, use hasApparentAge, hasOccupation, and hasNationality, not apparent_age, occupation, or nationality.'
    class_uri: llmp:LLMPersona
    attributes:
      has_achievement_event:
        description: Ontology property llmp:hasAchievementEvent. Use this field for hasAchievementEvent. Links an LLM persona
          to an event in which it attained, completed, received, created, discovered, or otherwise achieved something significant.
          Return a concise textual value or label, not a nested object. Return as a list; use an empty list if absent. Return
          plain string values only. If absent, return [] exactly. Never return null, None, [None], the string "[]", bracketed
          strings like "[34]", or nested objects.
        slot_uri: llmp:hasAchievementEvent
        range: string
        multivalued: true
      has_affiliation:
        description: Ontology property llmp:hasAffiliation. Use this field for hasAffiliation. Links an LLM persona to an
          organisation, faction, company, school, laboratory, guild, family house, or other bounded collective entity with
          which it is associated. The nature and strength of the affiliation may be unspecified. Return as a list; use an
          empty list if absent. Return plain string values only. If absent, return [] exactly. Never return null, None, [None],
          the string "[]", bracketed strings like "[34]", or nested objects.
        slot_uri: llmp:hasAffiliation
        range: string
        multivalued: true
      has_agent_type:
        description: Ontology property llmp:hasAgentType. Use this field for hasAgentType. Links an LLM persona to a controlled
          category specifying the kind of entity it represents, such as a natural person, fictional person, virtual character,
          artificial agent, or organisation representative. Return as a list; use an empty list if absent. Return plain string
          values only. If absent, return [] exactly. Never return null, None, [None], the string "[]", bracketed strings like
          "[34]", or nested objects.
        slot_uri: llmp:hasAgentType
        range: string
        multivalued: true
      has_alias:
        description: Ontology property llmp:hasAlias. Use this field for hasAlias. Associates an LLM persona with an alternative
          name, nickname, codename, stage name, role-play name, or other non-primary identifier. Return as a list; use an
          empty list if absent. Return plain string values only. If absent, return [] exactly. Never return null, None, [None],
          the string "[]", bracketed strings like "[34]", or nested objects.
        slot_uri: llmp:hasAlias
        range: string
        multivalued: true
      has_apparent_age:
        description: Ontology property llmp:hasApparentAge. Use this field for hasApparentAge. Associates an LLM persona with
          an expressed or perceived age expressed as an exact year (e.g., schema:value 25) or a range of years (e.g., schema:minValue
          20, schema:maxValue 30). Extract as a list with zero or one QuantitativeValue object. If no age is present, return
          an empty list. Do not return an empty list when an age is stated. Return only the numeric age value as an integer,
          not a nested object. Return as a list; use an empty list if absent. Return plain string values only. If absent,
          return [] exactly. Never return null, None, [None], the string "[]", bracketed strings like "[34]", or nested objects.
        slot_uri: llmp:hasApparentAge
        range: string
        multivalued: true
      has_attention_pattern:
        description: Ontology property llmp:hasAttentionPattern. Use this field for hasAttentionPattern. Describes the persona's
          attention pattern while performing tasks, such as being focused, distractible, detail-oriented, broad, selective,
          or sensitive to interruptions. Return as a list; use an empty list if absent. Return plain string values only. If
          absent, return [] exactly. Never return null, None, [None], the string "[]", bracketed strings like "[34]", or nested
          objects.
        slot_uri: llmp:hasAttentionPattern
        range: string
        multivalued: true
      has_audience_relation_role:
        description: Ontology property llmp:hasAudienceRelationRole. Use this field for hasAudienceRelationRole. Links an
          LLM persona to a controlled role describing how it should relate to the user or intended audience, such as assistant,
          coach, interviewer, companion, expert, or tutor. Return as a list; use an empty list if absent. Return plain string
          values only. If absent, return [] exactly. Never return null, None, [None], the string "[]", bracketed strings like
          "[34]", or nested objects.
        slot_uri: llmp:hasAudienceRelationRole
        range: string
        multivalued: true
      has_autonomy_level:
        description: Ontology property llmp:hasAutonomyLevel. Use this field for hasAutonomyLevel. Associates an LLM persona
          with a numeric value between 0 and 1 describing how independently it tends to decide or act. Return as a list; use
          an empty list if absent. Return plain string values only. If absent, return [] exactly. Never return null, None,
          [None], the string "[]", bracketed strings like "[34]", or nested objects.
        slot_uri: llmp:hasAutonomyLevel
        range: string
        multivalued: true
      has_backstory:
        description: Ontology property llmp:hasBackstory. Use this field for hasBackstory. Associates an LLM persona with
          a narrative summary of its past, origin, relevant history, and contextual background. Return as a list; use an empty
          list if absent. Return plain string values only. If absent, return [] exactly. Never return null, None, [None],
          the string "[]", bracketed strings like "[34]", or nested objects.
        slot_uri: llmp:hasBackstory
        range: string
        multivalued: true
      has_behavior_constraint_literal_feature:
        description: Ontology property llmp:hasBehaviorConstraintLiteralFeature. Use this field for hasBehaviorConstraintLiteralFeature.
          Links an LLM persona to a literal behavioural obligation, permission, recommendation, prohibition, or out-of-character
          condition. Return as a list; use an empty list if absent. Return plain string values only. If absent, return []
          exactly. Never return null, None, [None], the string "[]", bracketed strings like "[34]", or nested objects.
        slot_uri: llmp:hasBehaviorConstraintLiteralFeature
        range: string
        multivalued: true
      has_behavior_description:
        description: Ontology property llmp:hasBehaviorDescription. Use this field for hasBehaviorDescription. Provides a
          short natural-language summary of the persona's behavioural tendencies, goals, needs, preferences, decision style,
          task conduct, and constraints. Return as a list; use an empty list if absent. Return plain string values only. If
          absent, return [] exactly. Never return null, None, [None], the string "[]", bracketed strings like "[34]", or nested
          objects.
        slot_uri: llmp:hasBehaviorDescription
        range: string
        multivalued: true
      has_behavior_feature:
        description: Ontology property llmp:hasBehaviorFeature. Use this field for hasBehaviorFeature. Links an LLM persona
          to a non-literal feature describing how it tends to act, decide, pursue goals, express preferences, perform tasks,
          or respect behavioural constraints. Return as a list; use an empty list if absent. Return plain string values only.
          If absent, return [] exactly. Never return null, None, [None], the string "[]", bracketed strings like "[34]", or
          nested objects.
        slot_uri: llmp:hasBehaviorFeature
        range: string
        multivalued: true
      has_behavior_literal_feature:
        description: Ontology property llmp:hasBehaviorLiteralFeature. Use this field for hasBehaviorLiteralFeature. Links
          an LLM persona to a literal value describing its behaviour, behavioural tendencies, priorities, constraints, or
          task-related conduct. Return as a list; use an empty list if absent. Return plain string values only. If absent,
